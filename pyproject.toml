[project]
name = "benchops"
version = "0.6.2"
description = "A CLI tool to synchronize local Frappe development environments with remote servers."
readme = "README.md"
requires-python = ">=3.14.6"
authors = [
    { name = "Mohammad Hamdan", email = "mohammadasdev@gmail.com" }
]
keywords = ["frappe", "erpnext", "deployment", "cli", "sync"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = [
    "fabric>=3.2.3",
    "keyring>=25.7.0",
    "paramiko>=5.0.0",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "tomlkit>=0.15.1",
    "typer>=0.27.1",
]

[project.scripts]
benchops = "benchops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
